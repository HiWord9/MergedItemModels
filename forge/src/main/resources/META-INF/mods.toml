modLoader = "javafml"

loaderVersion = "${forge_loader_version_range}"
license = "${mod_license} ${mod_license_version}"
issueTrackerURL = "${mod_issue_tracker}"

clientSideOnly = true

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"

logoFile = "${mod_id}.png"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"
#[[mixins]]
#config = "${mod_id}.forge.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${forge_minecraft_version_range}"
ordering = "NONE"
side = "BOTH"